<div class="admin-layout">
  <app-sidebar></app-sidebar>

  <div class="admin-content-area">
    <div class="admin-topbar">
      <h2>Users Management</h2>
    </div>

    <!-- Loader -->
    <div class="loader-container" *ngIf="loading">
      <div class="spinner"></div>
      <p>Fetching users register...</p>
    </div>

    <!-- Users List Table -->
    <div class="admin-table-container" *ngIf="!loading">
      <table class="admin-table" aria-label="Users List">
        <thead>
          <tr>
            <th>User Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Security Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users">
            <td><strong>{{ u.firstName }} {{ u.lastName }}</strong></td>
            <td>{{ u.email }}</td>
            <td>{{ u.phone || 'N/A' }}</td>
            <td><span class="category-badge-table" style="background: rgba(91, 61, 245, 0.15); color: var(--accent-purple-light);">{{ u.role }}</span></td>
            <td>
              <span class="status-badge" [class.confirmed]="u.status === 'ACTIVE'" [class.cancelled]="u.status === 'BLOCKED'">
                {{ u.status }}
              </span>
            </td>
            <td>
              <button 
                (click)="toggleBlockStatus(u)" 
                class="btn-cancel" 
                [style.border-color]="u.status === 'ACTIVE' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(34, 197, 94, 0.3)'"
                [style.color]="u.status === 'ACTIVE' ? 'var(--color-danger)' : 'var(--color-success)'"
                style="padding: 6px 12px; font-size: 12px;">
                {{ u.status === 'ACTIVE' ? '🚫 Block User' : '✅ Activate User' }}
              </button>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="6" class="table-empty">No users registered on the platform.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
