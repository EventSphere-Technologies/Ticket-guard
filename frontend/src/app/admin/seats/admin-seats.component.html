<div class="admin-layout">
  <app-sidebar></app-sidebar>

  <div class="admin-content-area">
    <div class="admin-topbar">
      <h2>Seat Inventory & Management</h2>
      <div class="search-box" style="max-width: 250px;">
        <select [(ngModel)]="selectedVenueId" (change)="filterByVenue()" style="width: 100%; padding: 10px 16px; background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 30px; color: var(--text-primary); font-family: var(--font-main);">
          <option value="ALL">All Venues</option>
          <option *ngFor="let v of venues" [value]="v.id">{{ v.venueName }}</option>
        </select>
      </div>
    </div>

    <!-- Loader -->
    <div class="loader-container" *ngIf="loading">
      <div class="spinner"></div>
      <p>Loading seat layout inventory...</p>
    </div>

    <!-- Seats List Table -->
    <div class="admin-table-container" *ngIf="!loading">
      <table class="admin-table" aria-label="Seats Inventory List">
        <thead>
          <tr>
            <th>Seat ID</th>
            <th>Venue</th>
            <th>Row</th>
            <th>Seat No</th>
            <th>Tier Type</th>
            <th>Pricing</th>
            <th>Current Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of filteredSeats">
            <td><code>SEAT-{{ s.id }}</code></td>
            <td><strong>{{ s.venue?.venueName }}</strong></td>
            <td>{{ s.rowName }}</td>
            <td>{{ s.seatNumber }}</td>
            <td><span class="category-badge-table" style="background: rgba(124, 92, 255, 0.1); color: var(--accent-purple-light);">{{ s.seatType }}</span></td>
            <td>₹{{ s.price }}</td>
            <td>
              <span class="status-badge" [class.confirmed]="s.status === 'AVAILABLE'" [class.pending]="s.status === 'LOCKED'" [class.cancelled]="s.status === 'BOOKED'">
                {{ s.status }}
              </span>
            </td>
            <td>
              <button 
                (click)="toggleSeat(s)" 
                class="btn-cancel" 
                [style.border-color]="s.status === 'AVAILABLE' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(34, 197, 94, 0.3)'"
                [style.color]="s.status === 'AVAILABLE' ? 'var(--color-danger)' : 'var(--color-success)'"
                style="padding: 6px 12px; font-size: 12px;">
                {{ s.status === 'AVAILABLE' ? '🚫 Block Seat' : '✅ Release Seat' }}
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredSeats.length === 0">
            <td colspan="8" class="table-empty">No seats found matching the filters.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
