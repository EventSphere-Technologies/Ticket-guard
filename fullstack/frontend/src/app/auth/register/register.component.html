<div class="auth-container">
  <div class="auth-glass-card">
    <div class="auth-header">
      <div class="logo">Ticket<span>Guard</span></div>
      <p>Secure Event Ticketing & Bot Regulator</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div *ngIf="error" class="error-banner">
        {{ error }}
      </div>

      <div *ngIf="success" class="success-banner">
        Registration successful! Redirecting to login...
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" formControlName="firstName" placeholder="John"
            [class.invalid]="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid">
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" formControlName="lastName" placeholder="Doe"
            [class.invalid]="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="john@example.com"
          [class.invalid]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="validation-error">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number (10 digits)</label>
        <input type="text" id="phone" formControlName="phone" placeholder="9876543210"
          [class.invalid]="registerForm.get('phone')?.touched && registerForm.get('phone')?.invalid">
        <div *ngIf="registerForm.get('phone')?.touched && registerForm.get('phone')?.invalid" class="validation-error">
          Please enter a valid 10-digit phone number.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password (min 6 chars)</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••"
          [class.invalid]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="validation-error">
          Password must be at least 6 characters long.
        </div>
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" formControlName="role" style="width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: var(--text-primary); font-family: var(--font-main); font-size: 15px; outline: none;">
          <option value="USER">Customer Account</option>
          <option value="ADMIN">System Administrator</option>
        </select>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="btn-primary-block">
        <span *ngIf="!loading">Create Secure Account</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Login here</a>
      </div>
    </form>
  </div>
</div>
